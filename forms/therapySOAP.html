<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Therapy SOAP Note</title>
    <style>
        :root {
            --primary-font: 'Arial', sans-serif;
            --line-color: #333;
            --bg-color: #f9f9f9;
        }
        body {
            font-family: var(--primary-font);
            margin: 0;
            padding: 20px;
            color: #000;
            font-size: 13px; /* Slightly smaller to fit one page */
            line-height: 1.4;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
        }
        .header h1 {
            margin: 0;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .header h2 {
            margin: 5px 0 0;
            font-size: 14px;
            font-weight: normal;
        }
        .section-title {
            background-color: #e0e0e0;
            padding: 4px 8px;
            font-weight: bold;
            font-size: 14px;
            margin: 10px 0 5px 0;
            text-transform: uppercase;
        }
        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            gap: 10px;
        }
        .field {
            display: flex;
            align-items: flex-end;
            flex: 1;
        }
        .field label {
            white-space: nowrap;
            margin-right: 5px;
            font-weight: bold;
        }
        .line {
            flex-grow: 1;
            border-bottom: 1px solid var(--line-color);
            height: 1.2em;
        }
        .full-width {
            width: 100%;
            margin-bottom: 8px;
        }
        .full-width label {
            display: block;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .full-width .sub-text {
            font-weight: normal;
            font-size: 11px;
            color: #555;
            display: inline-block;
            margin-left: 5px;
        }
        .full-line {
            width: 100%;
            height: 20px;
            border-bottom: 1px solid var(--line-color);
            margin-bottom: 4px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
        }
        .box {
            width: 12px;
            height: 12px;
            border: 1px solid #000;
            margin-right: 5px;
            display: inline-block;
        }
        /* Table Styles for Exercises */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            margin-bottom: 10px;
        }
        th, td {
            border: 1px solid #000;
            padding: 6px;
            text-align: left;
        }
        th {
            background-color: #f0f0f0;
            font-weight: bold;
            width: 25%;
        }
        .exercise-col { width: 35%; }
        .sets-col { width: 15%; }
        
        /* Print Specific Styles */
        @media print {
            body {
                background: white;
                padding: 0;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .container {
                box-shadow: none;
                max-width: 100%;
                padding: 0;
            }
            th {
                background-color: #f0f0f0 !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>TRI-AD</h1>
            <h2>CHIROPRACTIC | MOVEMENT | LIFESTYLE</h2>
            <h2 style="font-weight: bold; margin-top: 10px;">EXERCISE THERAPY - SOAP NOTE</h2>
        </div>

        <!-- S - Subjective -->
        <div class="section-title">S - Subjective</div>
        <div class="row">
            <div class="field" style="flex: 2.5;"><label>Patient Name:</label><div class="line"></div></div>
            <div class="field" style="flex: 1;"><label>Date:</label><div class="line"></div></div>
            <div class="field" style="flex: 1.5;"><label>Visit # / Phase of Care:</label><div class="line"></div></div>
            <div class="field" style="flex: 1;"><label>Time:</label><div class="line"></div></div>
        </div>
        
        <div class="full-width">
            <label>Reason for Today's Session / Patient Report: <span class="sub-text">(How they're feeling, changes since last visit, soreness, stiffness, ADLs, compliance with home exercises)</span></label>
            <div class="full-line"></div>
            <div class="full-line"></div>
        </div>

        <div class="row">
            <div class="field" style="flex: 1;"><label>Pain Level (0-10):</label><div class="line"></div></div>
            <div class="field" style="flex: 3;"><label>Patient Feedback During Warm-Up:</label><div class="line"></div></div>
        </div>

        <!-- O - Objective -->
        <div class="section-title">O - Objective</div>
        <div class="full-width">
            <label>Movement Observations: <span class="sub-text">(Posture, gait, mobility, stability, balance, coordination)</span></label>
            <div class="full-line"></div>
        </div>

        <div class="full-width">
            <label>Exercise Session Details:</label>
            <table>
                <tr>
                    <th class="exercise-col">Exercise</th>
                    <th class="sets-col">Sets/Reps/Load</th>
                    <th class="exercise-col">Exercise</th>
                    <th class="sets-col">Sets/Reps/Load</th>
                </tr>
                <tr><td>1. </td><td></td><td>5. </td><td></td></tr>
                <tr><td>2. </td><td></td><td>6. </td><td></td></tr>
                <tr><td>3. </td><td></td><td>7. </td><td></td></tr>
                <tr><td>4. </td><td></td><td>8. </td><td></td></tr>
            </table>
        </div>

        <div class="full-width">
            <label>Modifications Made: <span class="sub-text">(Regressions, progressions, cueing adjustments)</span></label>
            <div class="full-line"></div>
        </div>

        <div class="row">
            <div class="field" style="flex: 1;">
                <label>Tolerance to Session:</label>
                <div class="checkbox-group" style="margin-left: 10px;">
                    <div class="checkbox-item"><span class="box"></span> Good</div>
                    <div class="checkbox-item"><span class="box"></span> Fair</div>
                    <div class="checkbox-item"><span class="box"></span> Poor</div>
                </div>
            </div>
            <div class="field" style="flex: 1;"><label>Notes:</label><div class="line"></div></div>
        </div>

        <!-- A - Assessment -->
        <div class="section-title">A - Assessment (Trainer's Perspective)</div>
        <div class="full-width">
            <label>Response to Today's Training: <span class="sub-text">(Fatigue level, form quality, compensations, improvements)</span></label>
            <div class="full-line"></div>
        </div>

        <div class="row">
            <div class="field" style="flex: 1.2;">
                <label>Progress Toward Functional Goals:</label>
                <div class="checkbox-group" style="margin-left: 10px;">
                    <div class="checkbox-item"><span class="box"></span> Improving</div>
                    <div class="checkbox-item"><span class="box"></span> Stable</div>
                    <div class="checkbox-item"><span class="box"></span> Regressing</div>
                </div>
            </div>
            <div class="field" style="flex: 1;"><label>Notes:</label><div class="line"></div></div>
        </div>

        <div class="full-width">
            <label>Communication to Chiropractor / Clinical Team: <span class="sub-text">(Anything clinically relevant the provider should know)</span></label>
            <div class="full-line"></div>
        </div>

        <!-- P - Plan -->
        <div class="section-title">P - Plan</div>
        <div class="full-width">
            <label>Next Session Focus: <span class="sub-text">(Strength, mobility, stability, endurance, specific regions)</span></label>
            <div class="full-line"></div>
        </div>

        <div class="row">
            <div class="field" style="flex: 3;"><label>Home Exercise / Activity Recommendations:</label><div class="line"></div></div>
            <div class="field" style="flex: 1;"><label>Frequency:</label><div class="line"></div></div>
        </div>
        
        <div class="row">
            <div class="field" style="flex: 3;"><label>Home Exercise / Activity Recommendations:</label><div class="line"></div></div>
            <div class="field" style="flex: 1;"><label>Frequency:</label><div class="line"></div></div>
        </div>

        <div class="row">
            <div class="field" style="flex: 3;"><label>Precautions / Modifications to Continue:</label><div class="line"></div></div>
            <div class="field" style="flex: 1;"><label>Trainer Initials:</label><div class="line"></div></div>
        </div>

    </div>

</body>
</html>
